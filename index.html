<style>
/* Layout: one scholar at the centre of the page; an arrow climbs up to their teachers. */
:root{
  --paper:#F4F6FA; --surface:#FFFFFF; --ink:#131A2C; --muted:#5A6379;
  --gold:#9E7620; --gold-soft:#F3EBD8; --lapis:#1C4C9C; --line:#D7DCE7;
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111E; --surface:#141B2C; --ink:#E6E9F1; --muted:#97A0B5;
  --gold:#D6B05A; --gold-soft:#2A2415; --lapis:#86A9EA; --line:#283049; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111E; --surface:#141B2C; --ink:#E6E9F1; --muted:#97A0B5;
  --gold:#D6B05A; --gold-soft:#2A2415; --lapis:#86A9EA; --line:#283049; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
[lang="ar"]{font-family:var(--f-ar)}

.top{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.top h1{margin:0;font-size:1.25rem;font-weight:600}
.top .ar{color:var(--gold);font-size:1.25rem}
.trail{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.trail button{border:0;background:none;color:var(--lapis);padding:2px 4px}

.stage{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding-top:40px}

.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;margin-bottom:12px}
.label .ar{font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--gold)}

.teachers{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:100%}
.t{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;min-width:0;transition:border-color .15s,transform .15s}
.t:hover{border-color:var(--gold);transform:translateY(-2px)}
.t .ar{font-size:1.15rem;color:var(--gold);line-height:1.3}
.t .n{font-weight:600}
.t .d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.t.stub{border-style:dashed}
.t .w{font-size:.78rem;color:var(--lapis)}
.none{font-style:italic;color:var(--muted);padding:12px}
.arrow.down{margin-top:18px}
.arrow.down .stem::before{display:none}
.arrow.down .stem::after{content:"";position:absolute;left:50%;bottom:-1px;translate:-50% 0;border:8px solid transparent;border-top:12px solid var(--gold);border-bottom:0}
.arrow.down .bracket{border:2px solid var(--gold);border-top:0;border-radius:0 0 10px 10px;margin:0 0 14px}
.arrow.down .bracket.one{border-width:0 0 0 2px;border-radius:0}
.arrow.down .bracket~*{}
.arrow.down .stem{margin-bottom:0}
.label.below{margin:12px 0 0}
/* centre row: name in the middle column, arrow and works to the right */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:0 24px;width:100%;max-width:1200px}
.mid{display:flex;flex-direction:column;align-items:center}
.side.right,.side.left{display:flex;align-items:flex-start;gap:12px;min-width:0;padding-top:0}
.side.left{justify-content:flex-end}
.side.left .label{justify-content:flex-end}
.harrow{flex:none;position:relative;width:44px;height:2px;background:var(--gold);margin-top:70px}
.harrow::after{content:"";position:absolute;right:-2px;top:50%;translate:0 -50%;border:8px solid transparent;border-left:12px solid var(--gold);border-right:0}
.harrow.left{background:var(--lapis)}
.harrow.left::after{right:auto;left:-2px;border:8px solid transparent;border-right:12px solid var(--lapis);border-left:0}
.works{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 auto}
.works .label{margin-bottom:2px}
.shelfrow{display:flex;flex-direction:column;gap:6px;min-width:0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;min-width:0}
.side.left .shelf{direction:rtl}.side.left .shelf>*{direction:ltr}
.book.friend{text-align:left;border:0;border-top:3px solid var(--lapis);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font:inherit;color:inherit}
.book.friend:hover{box-shadow:inset 0 0 0 1px var(--lapis)}
.book.friend.stub{box-shadow:inset 0 0 0 1px var(--line)}
.book{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:2px;scroll-snap-align:start;
  background:var(--gold-soft);border-top:3px solid var(--gold);border-radius:4px 4px 8px 8px;padding:7px 9px}
.book .bt{font-weight:600;font-style:italic;font-size:.85rem;line-height:1.2}
.book .ba{font-size:.9rem;color:var(--gold);line-height:1.25}
.book .bk{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lapis)}
.more{position:relative;align-self:stretch}
.more summary{text-align:center}
.side.left .works{align-items:stretch}
.more li button{all:unset;display:flex;flex-direction:column;cursor:pointer;width:100%}
.more summary{list-style:none;cursor:pointer;font-size:.82rem;border:1px solid var(--gold);color:var(--ink);background:var(--surface);border-radius:8px;padding:8px 10px;white-space:nowrap}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ▾"}
.more[open] summary::after{content:" ▴"}
.more ul{position:absolute;z-index:5;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;width:240px;max-height:300px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .14)}
.more li{display:flex;flex-direction:column;padding:7px 9px;border-radius:6px}
.more li:hover{background:var(--gold-soft)}
.more li .bt{font-weight:600;font-style:italic;font-size:.88rem}
.more li .bk{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lapis)}
@media (max-width:900px){
  .row{grid-template-columns:minmax(0,1fr)}
  .row>.mid{order:-1}
  .side.right,.side.left{flex-direction:column;align-items:center;padding-top:20px}
  .side.left .harrow{order:-1}
  .side.left .label{justify-content:center}
  .side.left .shelf{direction:ltr}
  .harrow{width:2px;height:40px;margin:0}
  .side.right,.side.left{align-items:center}
  .harrow::after,.harrow.left::after{right:auto;left:50%;top:auto;bottom:-2px;translate:-50% 0;border:8px solid transparent;border-top:12px solid var(--gold);border-bottom:0}
  .works{max-width:100%;width:100%;align-items:center}
  .shelfrow{max-width:100%}
  .more ul{right:auto;left:50%;translate:-50% 0}
}

/* the arrow: bracket under the teachers, a stem, an arrowhead pointing up */
.arrow{display:flex;flex-direction:column;align-items:center;width:100%}
.bracket{width:min(70%,560px);height:18px;border:2px solid var(--gold);border-bottom:0;border-radius:10px 10px 0 0;margin-top:14px}
.bracket.one{width:2px;border-width:0 0 0 2px;border-radius:0}
.stem{position:relative;width:2px;height:70px;background:var(--gold)}
.stem::before{content:"";position:absolute;left:50%;top:-1px;translate:-50% 0;border:8px solid transparent;border-bottom:12px solid var(--gold);border-top:0}
.bracket+.stem::before{top:-2px}
.headtop{width:0;height:0;border:9px solid transparent;border-bottom:13px solid var(--gold);border-top:0;margin-top:14px}

.center{margin-top:0;text-align:center;background:none;border:0;padding:8px 20px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.center .ar{font-size:clamp(2.2rem,7vw,3.4rem);color:var(--gold);line-height:1.35}
.center .n{font-size:clamp(1.6rem,4.8vw,2.4rem);font-weight:600;line-height:1.15;text-wrap:balance;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:6px;text-decoration-thickness:2px}
.center:hover .n{text-decoration-color:var(--gold)}
.dates{display:grid;grid-template-columns:auto auto;gap:4px 14px;margin-top:14px;font-family:var(--f-mono);font-size:.9rem;text-align:left}
.dates dt{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;padding-top:3px}
.dates dd{margin:0;font-variant-numeric:tabular-nums}

.bio{max-width:62ch;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.bio p{margin:0}
.bio .meta{font-size:.85rem;color:var(--muted);margin-top:8px}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.swap{animation:none}.t{transition:none}}

/* concept banner */
.concept{max-width:960px;margin:10px auto 0;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.concept b{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 8px;font-weight:500}
.sec{display:flex;flex-direction:column;align-items:center;width:100%}
.back{margin-top:14px;border:1px solid var(--gold);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:.88rem}
.stubnote{font-style:italic;color:var(--muted);font-size:.9rem;margin-top:6px}

/* phones: one column; teachers, the Sheikh, students, then works and companions */
@media (max-width:640px){
  body{padding-block:14px 48px;font-size:15px}
  .top h1{font-size:1.1rem}
  .trail{margin-left:0;width:100%;font-size:.8rem}
  .trail:has(> strong:only-child){display:none}
  .stage{padding-top:22px}
  .row{display:contents}
  .sec-t{order:1}.row>.mid{order:2}.bio{order:3}.sec-s{order:4}.side.right{order:5}.side.left{order:6}.hint{order:7}
  .harrow{display:none}
  .side.right,.side.left{padding-top:28px;width:100%}
  .teachers{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;
    width:calc(100% + 32px);margin-inline:-16px;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .teachers::-webkit-scrollbar{display:none}
  .teachers.fits{justify-content:center}
  .t{flex:0 0 auto;width:min(68vw,230px);scroll-snap-align:start;padding:10px 12px;text-align:center}
  .t .n{font-size:.95rem;line-height:1.25}
  .bracket{margin-top:8px;height:14px}
  .stem{height:40px}
  .arrow.down{margin-top:12px}
  .center{padding-top:4px}
  .dates{font-size:.82rem}
  .bio{margin-top:16px;padding:14px 16px}
  .label{justify-content:center}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .book{padding:9px 10px}
  .book .bt{font-size:.88rem}
  .more ul{position:static;translate:none;width:100%;max-height:none;margin-top:6px;box-shadow:none}
  .more summary{padding:10px}
  .hint{text-align:center;margin-top:24px}
}

/* doors: the page opens on the Sheikh alone; each box reveals its section (one at a time) */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(440px,100%);margin-top:20px}
.door{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;transition:border-color .15s}
.door:hover:not(:disabled){border-color:var(--gold)}
.door .di{font-size:1.1rem;color:var(--gold);width:1.2em;text-align:center}
.door .dl{display:flex;flex-direction:column;line-height:1.15;font-weight:600;font-size:.95rem;flex:1}
.door .dl .ar{font-weight:400;font-size:.95rem;color:var(--gold)}
.door .dn{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.door[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.door:disabled{opacity:.45;cursor:default}
.door.all{grid-column:1/-1;justify-content:center;border:0;background:none;color:var(--lapis);font-size:.9rem;padding:6px}
.stage:not(.open-t) .sec-t,.stage:not(.open-s) .sec-s{display:none}
.stage:not(.open-w) .side.right>*,.stage:not(.open-c) .side.left>*{display:none}
.stage:not(.open-t) .row>.mid{padding-top:12px}
@media (max-width:640px){
  .doors{width:100%;margin-top:18px}
  .stage:not(.open-w) .side.right,.stage:not(.open-c) .side.left{display:none}
}

/* source marks */
.ref{display:inline-flex;align-items:center;justify-content:center;min-width:1.35em;height:1.35em;padding:0 .3em;margin-left:.35em;vertical-align:.15em;
  font-family:var(--f-mono);font-size:.62rem;font-weight:500;line-height:1;font-style:normal;letter-spacing:0;text-transform:none;
  color:var(--lapis);background:var(--surface);border:1px solid var(--lapis);border-radius:999px;cursor:pointer}
.ref.disp{color:var(--gold);border-color:var(--gold);border-style:dashed}
.ref.unv{color:var(--muted);border-color:var(--muted);border-style:dotted}
.t .ref,.book .ref{align-self:center;margin:4px 0 0}
.book .ref{align-self:flex-start}
.sources{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.sources .label{margin-bottom:6px}
.sources ol{margin:0;padding-left:1.4em;font-size:.88rem}
.sources li{margin:3px 0}
.sources a,.refcard a{color:var(--lapis)}
.pub{color:var(--muted);font-size:.82em;margin-left:6px}
.sources .key{font-size:.75rem;color:var(--muted);margin-top:10px}
.sources .key .ref{cursor:default;margin-left:0}
.refcard{position:fixed;z-index:20;left:50%;bottom:max(16px,env(safe-area-inset-bottom));translate:-50% 0;width:min(440px,calc(100% - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgb(0 0 0 / .22);padding:12px 16px 14px}
.refcard[hidden]{display:none}
.rc-head{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rc-close{border:0;background:none;font-size:1.4rem;line-height:1;padding:0 4px;color:var(--muted)}
.refcard ul{margin:6px 0 0;padding:0;list-style:none}
.refcard li{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line)}
.refcard li:first-child{border-top:0}
.refcard .pub{margin-left:0}
.rc-note{margin:6px 0 4px;font-size:.88rem}
.rc-note.disp b{color:var(--gold)}.rc-note.unv b{color:var(--muted)}
</style>
</head>
<body>

  <h1>The Giants</h1><span class="ar" lang="ar">الأعلام</span>
  <nav class="trail" id="trail" aria-label="Path"></nav>

function render(id){
  const s=S[id]; if(!s) return render("nanautavi");
  const CI=CITE[id], refs=[];
  const num=k=>{let i=refs.indexOf(k); if(i<0){refs.push(k); i=refs.length-1;} return i+1;};
  const mark=f=>{ if(!CI) return ""; f=f||{src:[],conf:"uncertain"}; const src=(f.src||[]).filter(k=>SRC[k]); const n=src.map(num).sort((a,b)=>a-b);

  const best=(a,b)=>{const ok=f=>f&&f.src&&f.src.some(k=>SRC[k]); return ok(a)?a:ok(b)?b:(a||b);}; /* a link can be sourced from either person's record */

  const fS=t=>CI&&best((CI.s||{})[t],((CITE[t]||{}).t||{})[id]);
  const fC=o=>CI&&best((CI.c||{})[o],((CITE[o]||{}).c||{})[id]);
  const fW=w=>CI&&(CI.w||{})[w.t];

  const students=[...ST[id]].sort((a,b)=>(S[a].d??9999)-(S[b].d??9999));
  const card=(t,w)=>`<button type="button" class="t${S[t].stub?" stub":""}" data-go="${t}"><span class="ar" lang="ar">${esc(S[t].ar)}</span><span class="n">${esc(S[t].n)}</span>${w?`<span class="w">${esc(w)}</span>`:""}<span class="d">${tdate(t)}</span>${mark(fS(t))}</button>`;
  const comps=(C[id]||[]);
  const born=s.b?`${s.ba?"c. ":""}${s.b} AH · ${s.ba?"c. ":""}${s.bce} CE`:"Unknown";
  const tHTML='<section class="sec sec-t">'+(teachers.length

       <div class="teachers${teachers.length<2?" fits":""}">${teachers.map(t=>`<button type="button" class="t${S[t].stub?" stub":""}" data-go="${t}">
          <span class="ar" lang="ar">${esc(S[t].ar)}</span><span class="n">${esc(S[t].n)}</span>${W[id+">"+t]?`<span class="w">${esc(W[id+">"+t])}</span>`:""}<span class="d">${tdate(t)}</span>${mark(fT(t))}</button>`).join("")}</div>
       <div class="arrow"><div class="bracket${teachers.length===1?" one":""}"></div><div class="stem"></div></div>`
    : `<div class="none">${s.stub?"Next level — to be added":"No teachers recorded yet"}</div><div class="arrow"><div class="stem" style="opacity:.35"></div></div>`)+'</section>';

  $("stage").innerHTML=`${tHTML}
    <div class="row">
     <div class="side left">
      <div class="works">
        <div class="label"><span>Companions &amp; friends · ${comps.length}</span><span class="ar" lang="ar">الأقران</span></div>
        ${comps.length?`<div class="shelfrow">
          <div class="shelf">${comps.slice(0,5).map(c=>`<button type="button" class="book friend${S[c.id].stub?" stub":""}" data-go="${c.id}" title="${esc(c.why)}"><span class="bt">${esc(S[c.id].n)}</span><span class="ba" lang="ar">${esc(S[c.id].ar)}</span><span class="bk">${esc(c.why)}</span>${mark(fC(c.id))}</button>`).join("")}</div>
          ${comps.length>5?`<details class="more"><summary>+${comps.length-5} more</summary><ul>${comps.slice(5).map(c=>`<li><button type="button" data-go="${c.id}"><span class="bt">${esc(S[c.id].n)}</span><span class="bk">${esc(c.why)}</span>${mark(fC(c.id))}</button></li>`).join("")}</ul></details>`:""}
        </div>`:`<div class="none">${s.stub?"Next level — to be added":"No companions recorded yet"}</div>`}

      <div class="doors" role="group" aria-label="Show sections">

          `<button type="button" class="door" data-door="${k}" aria-pressed="${$("stage").classList.contains("open-"+k)}" ${n?"":"disabled"}><span class="di" aria-hidden="true">${ic}</span><span class="dl">${l}<span class="ar" lang="ar">${a}</span></span><span class="dn">${n}</span></button>`).join("")}

        ${(s.works||[]).length?`<div class="shelfrow">

          ${s.works.length>5?`<details class="more"><summary>+${s.works.length-5} more</summary><ul>${s.works.slice(5).map(w=>`<li title="${esc(w.n)}"><span class="bt">${esc(w.t)}</span><span class="bk">${esc(w.k)}</span>${mark(fW(w))}</li>`).join("")}</ul></details>`:""}
        </div>`:`<div class="none">${s.stub?"Next level — to be added":"No writings recorded yet"}</div>`}
      </div>
     </div>
    </div>
    <div class="bio" id="bio" ${bioOpen?"":"hidden"}><p>${esc(s.bio||"Full record to be written with scholars. Shown here to illustrate the network.")}${mark(CI&&CI.bio)}</p>
      <p class="meta">${esc(s.city)}</p>
      ${CI?`<div class="sources"><div class="label"><span>Sources</span><span class="ar" lang="ar">المصادر</span></div><ol id="srclist"></ol>
      <p class="key"><span class="ref">1</span> source · <span class="ref disp">1</span> sources disagree · <span class="ref unv">?</span> not yet sourced</p></div>`:""}</div>
    <section class="sec sec-s">${students.length
      ? `<div class="arrow down"><div class="stem"></div><div class="bracket${students.length===1?" one":""}"></div></div>
         <div class="teachers${students.length<2?" fits":""}">${students.map(t=>card(t,W[t+">"+id])).join("")}</div>
         <div class="label below"><span>Students &amp; disciples · ${students.length}</span><span class="ar" lang="ar">التلاميذ</span></div>`
      : `<div class="arrow down"><div class="stem" style="opacity:.35"></div></div><div class="none">${s.stub?"Next level — to be added":"No students recorded yet"}</div>`}</section>
    <p class="hint">${tap?"Tap":"Click"} a box to open it. ${tap?"Tap":"Click"} any name to bring that scholar to the centre. ${tap?"Tap":"Click"} the centre name for a short bio.</p>`;

  if($("srclist")) $("srclist").innerHTML=refs.map(k=>{const r=SRC[k]; return `<li><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>${r.a?` <span class="pub">${esc(r.a)}</span>`:""}</li>`;}).join("");
  $("me").onclick=()=>{bioOpen=!bioOpen;$("bio").hidden=!bioOpen;$("me").setAttribute("aria-expanded",bioOpen);};
  const i=trail.indexOf(id); if(i>=0) trail=trail.slice(0,i+1); else trail.push(id); trail=trail.slice(innerWidth<=640?-3:-6);
  $("trail").innerHTML=trail.map((t,k)=>k===trail.length-1?`<strong>${esc(S[t].n)}</strong>`:`<button type="button" data-go="${t}">${esc(S[t].n)}</button><span aria-hidden="true">›</span>`).join("");

function go(id){ if(location.hash.slice(1)===id) render(id); else location.hash=id; }
addEventListener("hashchange",()=>render(location.hash.slice(1)));
function showRef(el){
  const keys=el.dataset.ref?el.dataset.ref.split(" "):[], conf=el.dataset.conf, note=el.dataset.note, card=$("refcard");
  const msg=conf==="disputed"?`<p class="rc-note disp"><b>Sources disagree.</b> ${note}</p>`:(!keys.length||conf==="uncertain")?`<p class="rc-note unv"><b>Not yet sourced.</b> To be checked by scholars.${note?" "+note:""}</p>`:(note?`<p class="rc-note">${note}</p>`:"");
  $("rc-body").innerHTML=msg+(keys.length?`<ul>${keys.map(k=>{const r=SRC[k]; return `<li><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>${r.a?`<span class="pub">${esc(r.a)}</span>`:""}</li>`;}).join("")}</ul>`:"");
  card.hidden=false;
}

document.addEventListener("click",e=>{
  const r=e.target.closest(".ref[data-ref]"); if(r){ showRef(r); return; }
  if(!e.target.closest("#refcard")) $("refcard").hidden=true; else if(e.target.closest(".rc-close")){ $("refcard").hidden=true; return; } else if(!e.target.closest("a")) return;
  const d=e.target.closest("[data-door]");
  if(d){const st=$("stage"), k=d.dataset.door, all=["t","s","w","c"];
    if(k==="all"){const on=!all.every(x=>st.classList.contains("open-"+x)); all.forEach(x=>st.classList.toggle("open-"+x,on));}
    else {const was=st.classList.contains("open-"+k)&&all.filter(x=>st.classList.contains("open-"+x)).length===1; all.forEach(x=>st.classList.remove("open-"+x)); if(!was) st.classList.add("open-"+k);}
    document.querySelectorAll("[data-door]").forEach(b=>{const x=b.dataset.door; if(x==="all") b.textContent=all.every(y=>st.classList.contains("open-"+y))?"Hide all":"Show all"; else b.setAttribute("aria-pressed",st.classList.contains("open-"+x));});
    if(k==="t"&&st.classList.contains("open-t")) st.querySelector(".sec-t").scrollIntoView({behavior:"smooth",block:"start"});
    else if(k!=="all"&&st.classList.contains("open-"+k)){const el=st.querySelector({s:".sec-s",w:".side.right",c:".side.left"}[k]); el&&el.scrollIntoView({behavior:"smooth",block:"nearest"});}
    return;}
  const g=e.target.closest("[data-go]"); if(g){bioOpen=false;go(g.dataset.go);}});
{const h=location.hash.slice(1); const start=S[h]?h:"nanautavi"; try{history.replaceState(null,"","#"+start)}catch(e){} render(start);}
</script>
</body>
</html>
