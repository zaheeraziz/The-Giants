<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Giants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one scholar at the centre; teachers above, students below, works to the right, companions to the left. */
:root{
  --paper:#F4F6FA; --surface:#FFFFFF; --ink:#131A2C; --muted:#5A6379;
  --gold:#9E7620; --gold-soft:#F3EBD8; --lapis:#1C4C9C; --lapis-soft:#E3EAF7; --line:#D7DCE7;
  --ok:#2F7A4B; --warn:#A36A00; --risk:#A3342B;
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Noto Nastaliq Urdu","Geeza Pro",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111E; --surface:#141B2C; --ink:#E6E9F1; --muted:#97A0B5;
  --gold:#D6B05A; --gold-soft:#2A2415; --lapis:#86A9EA; --lapis-soft:#1A2641; --line:#283049;
  --ok:#6CC28E; --warn:#E0A84A; --risk:#E27A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111E; --surface:#141B2C; --ink:#E6E9F1; --muted:#97A0B5;
  --gold:#D6B05A; --gold-soft:#2A2415; --lapis:#86A9EA; --lapis-soft:#1A2641; --line:#283049;
  --ok:#6CC28E; --warn:#E0A84A; --risk:#E27A70; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
[lang="ar"],[lang="ur"]{font-family:var(--f-ar)}

.top{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.top h1{margin:0;font-size:1.25rem;font-weight:600}
.top .ar{color:var(--gold);font-size:1.25rem}
.trail{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.trail button{border:0;background:none;color:var(--lapis);padding:2px 4px}
.trail strong{font-weight:600;color:var(--ink)}

.stage{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding-top:32px}
.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
.label .ar{font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--gold)}
.label .n{font-family:var(--f-mono);letter-spacing:0}
.none{font-style:italic;color:var(--muted);padding:8px}

/* person cards (teachers, students) */
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:100%}
.t{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;min-width:0;max-width:220px;text-align:center;transition:border-color .15s,transform .15s}
.t:hover{border-color:var(--gold);transform:translateY(-2px)}
.t .ar{font-size:1.1rem;color:var(--gold);line-height:1.3}
.t .n{font-weight:600;line-height:1.2}
.t .w{font-size:.76rem;color:var(--lapis);line-height:1.25}
.t .d{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.t.stub{border-style:dashed}
.more-people{margin-top:8px}

/* arrows */
.arrow{display:flex;flex-direction:column;align-items:center;width:100%}
.bracket{width:min(70%,560px);height:18px;border:2px solid var(--gold);border-bottom:0;border-radius:10px 10px 0 0;margin-top:12px}
.bracket.one{width:2px;border-width:0 0 0 2px;border-radius:0}
.stem{position:relative;width:2px;height:56px;background:var(--gold)}
.arrow.up .stem::before{content:"";position:absolute;left:50%;top:-2px;translate:-50% 0;border:8px solid transparent;border-bottom:12px solid var(--gold);border-top:0}
.arrow.down{margin-top:16px}
.arrow.down .stem::after{content:"";position:absolute;left:50%;bottom:-1px;translate:-50% 0;border:8px solid transparent;border-top:12px solid var(--gold);border-bottom:0}
.arrow.down .bracket{border:2px solid var(--gold);border-top:0;border-radius:0 0 10px 10px;margin:0 0 12px}
.arrow.down .bracket.one{border-width:0 0 0 2px;border-radius:0}
.label.below{margin:10px 0 0}

/* centre row */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:0 20px;width:100%}
.mid{display:flex;flex-direction:column;align-items:center}
.center{text-align:center;background:none;border:0;padding:4px 16px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.center .ar{font-size:clamp(2rem,6vw,3.1rem);color:var(--gold);line-height:1.35}
.center .n{font-size:clamp(1.5rem,4.4vw,2.2rem);font-weight:600;line-height:1.15;text-wrap:balance;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:6px;text-decoration-thickness:2px}
.center:hover .n{text-decoration-color:var(--gold)}
.center .title{font-size:.9rem;font-style:italic;color:var(--muted);margin-top:6px}
.dates{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:12px 0 0;font-family:var(--f-mono);font-size:.86rem;text-align:left}
.dates dt{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;padding-top:3px}
.dates dd{margin:0;font-variant-numeric:tabular-nums}

.side{display:flex;align-items:flex-start;gap:12px;min-width:0}
.side.left{justify-content:flex-end}
.side.left .label{justify-content:flex-end}
.harrow{flex:none;position:relative;width:40px;height:2px;background:var(--gold);margin-top:70px}
.harrow::after{content:"";position:absolute;right:-2px;top:50%;translate:0 -50%;border:8px solid transparent;border-left:12px solid var(--gold);border-right:0}
.harrow.left{background:var(--lapis)}
.harrow.left::after{right:auto;left:-2px;border:8px solid transparent;border-right:12px solid var(--lapis);border-left:0}
.panel{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;min-width:0}
.side.left .shelf{direction:rtl}.side.left .shelf>*{direction:ltr}
.tile{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:2px;text-align:left;font:inherit;color:inherit;
  background:var(--gold-soft);border:0;border-top:3px solid var(--gold);border-radius:4px 4px 8px 8px;padding:7px 9px;cursor:pointer}
.tile .bt{font-weight:600;font-size:.84rem;line-height:1.2}
.tile.book .bt{font-style:italic}
.tile .ba{font-size:.9rem;color:var(--gold);line-height:1.25}
.tile .bk{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lapis)}
.tile.friend{background:var(--surface);border-top-color:var(--lapis);box-shadow:inset 0 0 0 1px var(--line)}
.tile.friend:hover{box-shadow:inset 0 0 0 1px var(--lapis)}
.tile.book:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.tile.stub{box-shadow:inset 0 0 0 1px var(--line)}
.more{position:relative}
.more summary{list-style:none;cursor:pointer;text-align:center;font-size:.82rem;border:1px solid var(--gold);background:var(--surface);border-radius:8px;padding:7px 10px;white-space:nowrap}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ▾"}
.more[open] summary::after{content:" ▴"}
.more ul{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;min-width:220px;max-height:320px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .14)}
.more li button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;padding:7px 9px;border-radius:6px;cursor:pointer}
.more li button:hover,.more li button:focus-visible{background:var(--gold-soft)}
.more li .bt{font-weight:600;font-size:.88rem}
.more li .bk{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lapis)}
.people-more summary{display:inline-block}
.people-more ul{left:50%;right:auto;translate:-50% 0;width:280px}

/* detail panel */
.detail{width:100%;max-width:820px;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;position:relative}
.detail h2{margin:0 0 2px;font-size:1.2rem;font-weight:600;padding-right:70px}
.detail .sub{color:var(--gold);font-size:1.05rem}
.detail p{margin:8px 0 0;max-width:68ch}
.detail .close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 10px;font-size:.82rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:14px 0 0;font-size:.93rem}
.facts dt{color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.facts dd{margin:0;min-width:0}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--lapis-soft);border-radius:6px;padding:1px 8px;font-size:.88rem}
.conf{display:inline-block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.conf.attested{color:var(--ok)}.conf.reported{color:var(--lapis)}.conf.disputed{color:var(--warn)}.conf.uncertain{color:var(--risk)}
.srcs{margin:14px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.srcs li{margin:2px 0}
.srcs a{color:var(--lapis)}
.events{margin:6px 0 0;padding-left:18px}
.events li{margin:2px 0}
.hint{font-size:.8rem;color:var(--muted);margin-top:12px;text-align:center}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.swap{animation:none}.t{transition:none}}

@media (max-width:900px){
  .row{grid-template-columns:minmax(0,1fr)}
  .row>.mid{order:-1}
  .side{flex-direction:column;align-items:center;padding-top:16px}
  .side.left .harrow{order:-1}
  .side.left .label{justify-content:center}
  .side.left .shelf{direction:ltr}
  .harrow{width:2px;height:36px;margin:0}
  .harrow::after,.harrow.left::after{right:auto;left:50%;top:auto;bottom:-2px;translate:-50% 0;border:8px solid transparent;border-top:12px solid var(--gold);border-bottom:0}
  .harrow.left::after{border-top-color:var(--lapis)}
  .panel{width:100%}
  .facts{grid-template-columns:minmax(0,1fr)}
  .facts dt{padding-top:6px}
}
</style>
</head>
<body>
<div class="top">
  <h1>The Giants</h1><span class="ar" lang="ar">الأعلام</span>
  <nav class="trail" id="trail" aria-label="Path"></nav>
</div>
<main class="stage" id="stage" aria-live="polite"></main>

<script src="data/bundle.js"></script>
<script>
/* ---------- index the bundle (data model v1; see docs/data-model.md) ---------- */
const G = window.GIANTS;
const by = (arr, key) => { const m = {}; for (const r of arr) (m[r[key]] = m[r[key]] || []).push(r); return m; };
const P = Object.fromEntries(G.persons.map(p => [p.id, p]));
const WK = Object.fromEntries(G.works.map(w => [w.id, w]));
const PL = Object.fromEntries((G.places||[]).map(p => [p.id, p]));
const IN = Object.fromEntries((G.institutions||[]).map(i => [i.id, i]));
const EV = Object.fromEntries((G.events||[]).map(e => [e.id, e]));
const SRC = Object.fromEntries((G.sources||[]).map(s => [s.id, s]));
const NAMES = by(G.names, "person_id"), LIFE = by(G.life_events, "person_id");
const OUT = by(G.relations, "from"), INC = by(G.relations, "to");
const CONTRIB = by(G.work_contributors, "person_id");
const PINST = by(G.person_institutions||[], "person_id"), BYINST = by(G.person_institutions||[], "institution_id");
const PEVT = by(G.person_events||[], "person_id"), PPLACE = by(G.person_places||[], "person_id");

const UP = ["studied_under","ijaza_from","bayah_to","khalifa_of"];       // from = student, to = teacher
const PEER = ["companion_of","fellow_student","corresponded_with","debated","family","co_founder"];
const TYPE_LABEL = {studied_under:"Studied under",ijaza_from:"Ijāza",bayah_to:"Bayʿah (spiritual guide)",khalifa_of:"Khalīfa",
  companion_of:"Companion",fellow_student:"Fellow student",corresponded_with:"Correspondent",debated:"Debated",family:"Family",co_founder:"Co-founder"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const placeName = id => PL[id]?.name?.en || "";

function nameOf(id, lang) {
  const ns = NAMES[id] || [];
  const pick = ns.find(n => n.type === "shuhra" && n.lang === lang && n.primary) || ns.find(n => n.type === "shuhra" && n.lang === lang);
  return pick ? (lang === "en" ? pick.translit || pick.value : pick.value) : "";
}
function display(id, lang = "en") {
  const p = P[id]; const base = nameOf(id, lang) || (lang === "en" ? id : "");
  if (!base) return "";
  if (p && p.honorific === false) return base;
  return (lang === "en" ? "Sheikh " : "الشيخ ") + base;
}
function life(id, type) {
  const ev = (LIFE[id] || []).filter(e => e.type === type);
  return ev.find(e => e.preferred) || ev[0] || null;
}
const MONTHS_G = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_H = ["","Muḥarram","Ṣafar","Rabīʿ I","Rabīʿ II","Jumādā I","Jumādā II","Rajab","Shaʿbān","Ramaḍān","Shawwāl","Dhū al-Qaʿda","Dhū al-Ḥijja"];
function fmtDate(d, long) {
  if (!d) return null;
  const c = d.approx ? "c. " : "";
  const h = d.hijri?.y ? (long && d.hijri.m ? `${d.hijri.d ? d.hijri.d + " " : ""}${MONTHS_H[d.hijri.m]} ` : "") + `${d.hijri.y} AH` : null;
  const g = d.gregorian?.y ? (long && d.gregorian.m ? `${d.gregorian.d ? d.gregorian.d + " " : ""}${MONTHS_G[d.gregorian.m]} ` : "") + `${d.gregorian.y} CE` : null;
  return c + [h, g].filter(Boolean).join(" · ");
}
const shortDeath = id => { const e = life(id, "death"); return e ? "d. " + fmtDate(e.date) : "Death date unknown"; };
const deathSort = id => life(id, "death")?.date?.sort ?? 9999;
const conf = c => c ? `<span class="conf ${esc(c)}">${esc(c)}</span>` : "";
const relLabel = r => r.note?.en || (r.subjects && r.subjects.length ? r.subjects.join(", ") : TYPE_LABEL[r.type] || r.type);

/* ---------- derived views ---------- */
function teachersOf(id) {
  const seen = new Map();
  for (const r of OUT[id] || []) if (UP.includes(r.type) && !seen.has(r.to)) seen.set(r.to, r);
  return [...seen.entries()].map(([pid, r]) => ({ id: pid, r })).sort((a, b) => deathSort(a.id) - deathSort(b.id));
}
function studentsOf(id) {
  const seen = new Map();
  for (const r of INC[id] || []) if (UP.includes(r.type) && !seen.has(r.from)) seen.set(r.from, r);
  return [...seen.entries()].map(([pid, r]) => ({ id: pid, r })).sort((a, b) => deathSort(a.id) - deathSort(b.id));
}
function companionsOf(id) {
  const out = new Map();
  for (const r of OUT[id] || []) if (PEER.includes(r.type)) out.set(r.to, r);
  for (const r of INC[id] || []) if (PEER.includes(r.type) && !out.has(r.from)) out.set(r.from, r);
  // derived: shared founding role at the same institution
  for (const pi of PINST[id] || []) if (["founder","co_founder"].includes(pi.role))
    for (const other of BYINST[pi.institution_id] || [])
      if (other.person_id !== id && ["founder","co_founder"].includes(other.role) && !out.has(other.person_id))
        out.set(other.person_id, { type: "co_founder", note: { en: "Co-founder of " + (IN[pi.institution_id]?.name?.en || "the madrasa") } });
  return [...out.entries()].map(([pid, r]) => ({ id: pid, r })).sort((a, b) => (a.r.rank ?? 99) - (b.r.rank ?? 99));
}
function worksOf(id) {
  return (CONTRIB[id] || []).filter(c => ["author","compiler","commentator"].includes(c.role))
    .map(c => ({ w: WK[c.work_id], role: c.role })).filter(x => x.w)
    .sort((a, b) => (a.w.rank ?? 99) - (b.w.rank ?? 99));
}

/* ---------- render ---------- */
let trail = [], open = null, current = null; // open = {kind:"person"|"work", id}

function personCard(pid, label) {
  const p = P[pid];
  return `<button type="button" class="t${p?.status === "stub" ? " stub" : ""}" data-go="${pid}">
    <span class="ar" lang="ar">${esc(display(pid, "ar"))}</span><span class="n">${esc(display(pid))}</span>
    ${label ? `<span class="w">${esc(label)}</span>` : ""}<span class="d">${esc(shortDeath(pid))}</span></button>`;
}
function peopleBlock(list, max) {
  const shown = list.slice(0, max).map(x => personCard(x.id, relLabel(x.r))).join("");
  const rest = list.slice(max);
  return `<div class="people">${shown}</div>` + (rest.length ? `<details class="more people-more more-people"><summary>+${rest.length} more</summary><ul>${
    rest.map(x => `<li><button type="button" data-go="${x.id}"><span class="bt">${esc(display(x.id))}</span><span class="bk">${esc(relLabel(x.r))}</span></button></li>`).join("")}</ul></details>` : "");
}

function render(id) {
  if (!P[id]) id = G.start;
  current = id;
  const p = P[id];
  const T = teachersOf(id), S = studentsOf(id), C = companionsOf(id), W = worksOf(id);
  const born = life(id, "birth"), died = life(id, "death");
  const title = (NAMES[id] || []).find(n => n.type === "title" && n.lang === "en");

  const top = T.length
    ? `<div class="label"><span>Teachers</span><span class="ar" lang="ar">الشيوخ</span><span class="n">${T.length}</span></div>
       ${peopleBlock(T, 8)}
       <div class="arrow up"><div class="bracket${T.length === 1 ? " one" : ""}"></div><div class="stem"></div></div>`
    : `<div class="none">No teachers recorded yet</div><div class="arrow up"><div class="stem" style="opacity:.35"></div></div>`;

  const left = `<div class="side left"><div class="panel">
      <div class="label"><span>Companions &amp; friends</span><span class="ar" lang="ar">الأقران</span><span class="n">${C.length}</span></div>
      ${C.length ? `<div class="shelf">${C.slice(0, 5).map(x => `<button type="button" class="tile friend${P[x.id]?.status === "stub" ? " stub" : ""}" data-go="${x.id}" title="${esc(relLabel(x.r))}">
          <span class="bt">${esc(display(x.id))}</span><span class="ba" lang="ar">${esc(display(x.id, "ar"))}</span><span class="bk">${esc(relLabel(x.r))}</span></button>`).join("")}</div>
        ${C.length > 5 ? `<details class="more"><summary>+${C.length - 5} more</summary><ul>${C.slice(5).map(x => `<li><button type="button" data-go="${x.id}"><span class="bt">${esc(display(x.id))}</span><span class="bk">${esc(relLabel(x.r))}</span></button></li>`).join("")}</ul></details>` : ""}`
      : `<div class="none">No companions recorded yet</div>`}
    </div><div class="harrow left" aria-hidden="true"></div></div>`;

  const right = `<div class="side right"><div class="harrow" aria-hidden="true"></div><div class="panel">
      <div class="label"><span>Major works</span><span class="ar" lang="ar">المؤلفات</span><span class="n">${W.length}</span></div>
      ${W.length ? `<div class="shelf">${W.slice(0, 5).map(x => `<button type="button" class="tile book" data-work="${x.w.id}" title="${esc(x.w.description?.en || "")}">
          <span class="bt">${esc(x.w.title.translit)}</span>${x.w.title.original ? `<span class="ba" lang="${esc(x.w.languages?.[0] || "ar")}">${esc(x.w.title.original)}</span>` : ""}<span class="bk">${esc((x.w.genres || [])[0] || "")} · ${esc((x.w.languages || []).join("/"))}</span></button>`).join("")}</div>
        ${W.length > 5 ? `<details class="more"><summary>+${W.length - 5} more</summary><ul>${W.slice(5).map(x => `<li><button type="button" data-work="${x.w.id}"><span class="bt">${esc(x.w.title.translit)}</span><span class="bk">${esc((x.w.genres || [])[0] || "")} · ${esc((x.w.languages || []).join("/"))}</span></button></li>`).join("")}</ul></details>` : ""}`
      : `<div class="none">No works recorded yet</div>`}
    </div></div>`;

  const mid = `<div class="mid">
      <button type="button" class="center swap" id="me" aria-expanded="${open?.kind === "person"}">
        <span class="ar" lang="ar">${esc(display(id, "ar"))}</span><span class="n">${esc(display(id))}</span>
        ${title ? `<span class="title">${esc(title.translit || title.value)}</span>` : ""}
      </button>
      <dl class="dates"><dt>Born</dt><dd>${esc(born ? fmtDate(born.date, true) : "Unknown")}</dd><dt>Died</dt><dd>${esc(died ? fmtDate(died.date, true) : "Unknown")}</dd></dl>
    </div>`;

  const bottom = S.length
    ? `<div class="arrow down"><div class="stem"></div><div class="bracket${S.length === 1 ? " one" : ""}"></div></div>
       ${peopleBlock(S, 8)}
       <div class="label below"><span>Students &amp; disciples</span><span class="ar" lang="ar">التلاميذ</span><span class="n">${S.length}</span></div>`
    : `<div class="arrow down"><div class="stem" style="opacity:.35"></div></div><div class="none">No students recorded yet</div>`;

  $("stage").innerHTML = `${top}<div class="row">${left}${mid}${right}</div>
    <div id="detail"></div>${bottom}
    <p class="hint">Click any name to move it to the centre. Click the centre name for the full record, or a book for its details.</p>`;
  if (open?.kind === "person" && open.id === id) showPerson(id); else if (open?.kind === "work") showWork(open.id); else open = null;

  const i = trail.indexOf(id); if (i >= 0) trail = trail.slice(0, i + 1); else trail.push(id); trail = trail.slice(-6);
  $("trail").innerHTML = trail.map((t, k) => k === trail.length - 1 ? `<strong>${esc(display(t))}</strong>` :
    `<button type="button" data-go="${t}">${esc(display(t))}</button><span aria-hidden="true">›</span>`).join("");
}

function sourcesList(ids) {
  const uniq = [...new Set(ids.filter(Boolean))].map(s => SRC[s]).filter(Boolean);
  return uniq.length ? `<ul class="srcs"><li><strong>Sources</strong></li>${uniq.map(s =>
    `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}${s.note ? " — " + esc(s.note) : ""}</li>`).join("")}</ul>` : "";
}

function showPerson(id) {
  const p = P[id]; open = { kind: "person", id };
  const ns = NAMES[id] || [];
  const born = life(id, "birth"), died = life(id, "death");
  const places = (PPLACE[id] || []).filter(x => x.role !== "born" && x.role !== "died" && x.role !== "buried");
  const buried = (PPLACE[id] || []).find(x => x.role === "buried");
  const inst = PINST[id] || [], evs = PEVT[id] || [];
  const cites = [...(p.citations || []), ...(born?.citations || []), ...(died?.citations || []), ...ns.flatMap(n => n.citations || []),
    ...(OUT[id] || []).flatMap(r => r.citations || []), ...(INC[id] || []).flatMap(r => r.citations || [])];
  $("detail").innerHTML = `<section class="detail swap" aria-label="Record">
    <button type="button" class="close" data-close>Close</button>
    <h2>${esc(display(id))}</h2><div class="sub" lang="ar">${esc(display(id, "ar"))}</div>
    ${p.summary?.en ? `<p>${esc(p.summary.en)}</p>` : `<p>Full record not yet written. This person appears in the network of others.</p>`}
    ${p.legacy?.en ? `<p><em>${esc(p.legacy.en)}</em></p>` : ""}
    <dl class="facts">
      ${ns.length > 1 ? `<dt>Names</dt><dd class="names">${ns.filter(n => n.type !== "shuhra" || !n.primary).map(n => `<span title="${esc(n.type)}" ${n.lang !== "en" ? `lang="${esc(n.lang)}"` : ""}>${esc(n.lang === "en" ? n.translit || n.value : n.value)}</span>`).join("")}</dd>` : ""}
      <dt>Born</dt><dd>${esc(born ? fmtDate(born.date, true) : "Unknown")}${born?.place_id ? ", " + esc(placeName(born.place_id)) : ""}${conf(born?.confidence)}</dd>
      <dt>Died</dt><dd>${esc(died ? fmtDate(died.date, true) : "Unknown")}${died?.place_id ? ", " + esc(placeName(died.place_id)) : ""}${conf(died?.confidence)}</dd>
      ${buried ? `<dt>Buried</dt><dd>${esc(buried.note?.en || placeName(buried.place_id))}${conf(buried.confidence)}</dd>` : ""}
      ${places.length ? `<dt>Active in</dt><dd>${places.map(x => esc(placeName(x.place_id)) + (x.role ? ` (${esc(x.role)})` : "")).join(", ")}</dd>` : ""}
      ${p.tags?.length ? `<dt>Tradition</dt><dd>${p.tags.map(esc).join(" · ")}</dd>` : ""}
      ${inst.length ? `<dt>Institutions</dt><dd>${inst.map(x => `${esc(IN[x.institution_id]?.name?.en || x.institution_id)} — ${esc(x.role.replace("_", "-"))}${x.note?.en ? " (" + esc(x.note.en) + ")" : ""}`).join("<br>")}</dd>` : ""}
      ${evs.length ? `<dt>Events</dt><dd><ul class="events">${evs.map(x => `<li>${esc(EV[x.event_id]?.name?.en || x.event_id)}${EV[x.event_id]?.date ? ", " + esc(fmtDate(EV[x.event_id].date)) : ""}${x.note?.en ? " — " + esc(x.note.en) : ""}</li>`).join("")}</ul></dd>` : ""}
      ${p.note?.en ? `<dt>Note</dt><dd>${esc(p.note.en)}</dd>` : ""}
    </dl>
    ${sourcesList(cites)}
  </section>`;
  $("me")?.setAttribute("aria-expanded", "true");
}

function showWork(wid) {
  const w = WK[wid]; if (!w) return; open = { kind: "work", id: wid };
  const contrib = G.work_contributors.filter(c => c.work_id === wid);
  const rels = (G.work_relations || []).filter(r => r.from === wid || r.to === wid);
  $("detail").innerHTML = `<section class="detail swap" aria-label="Book">
    <button type="button" class="close" data-close>Close</button>
    <h2><em>${esc(w.title.translit)}</em></h2>${w.title.original ? `<div class="sub" lang="${esc(w.languages?.[0] || "ar")}">${esc(w.title.original)}</div>` : ""}
    ${w.title.meaning ? `<p>“${esc(w.title.meaning)}”</p>` : ""}
    ${w.description?.en ? `<p>${esc(w.description.en)}</p>` : ""}
    <dl class="facts">
      <dt>By</dt><dd>${contrib.map(c => `<button type="button" class="linkish" data-go="${c.person_id}" style="all:unset;cursor:pointer;color:var(--lapis)">${esc(display(c.person_id))}</button> (${esc(c.role)})`).join(", ")}</dd>
      ${w.genres?.length ? `<dt>Subject</dt><dd>${w.genres.map(esc).join(", ")}</dd>` : ""}
      ${w.languages?.length ? `<dt>Language</dt><dd>${w.languages.map(l => ({ur:"Urdu",ar:"Arabic",fa:"Persian",en:"English"})[l] || l).join(", ")}</dd>` : ""}
      ${w.composed ? `<dt>Written</dt><dd>${esc(fmtDate(w.composed))}</dd>` : ""}
      ${w.status ? `<dt>Status</dt><dd>${esc(w.status)}${w.publication ? " — " + esc(w.publication) : ""}${conf(w.confidence)}</dd>` : ""}
      ${rels.length ? `<dt>Related</dt><dd>${rels.map(r => { const other = r.from === wid ? r.to : r.from; const lbl = r.from === wid ? r.type.replace(/_/g, " ") : "has " + r.type.replace(/_/g, " ").replace(" on", "") + ":";
          return `${esc(lbl)} <em>${esc(WK[other]?.title?.translit || other)}</em>`; }).join("<br>")}</dd>` : ""}
    </dl>
    ${sourcesList(w.citations || [])}
  </section>`;
}

function go(id) { open = null; if (location.hash.slice(1) === id) render(id); else location.hash = id; }
addEventListener("hashchange", () => render(location.hash.slice(1)));
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const w = e.target.closest("[data-work]"); if (w) { w.closest("details")?.removeAttribute("open"); showWork(w.dataset.work); $("detail").scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  if (e.target.closest("[data-close]")) { open = null; $("detail").innerHTML = ""; $("me")?.setAttribute("aria-expanded", "false"); return; }
  if (e.target.closest("#me")) { const id = current;
    if (open?.kind === "person") { open = null; $("detail").innerHTML = ""; $("me").setAttribute("aria-expanded", "false"); } else showPerson(id); }
  if (!e.target.closest("details")) document.querySelectorAll("details[open]").forEach(d => d.removeAttribute("open"));
});
render(location.hash.slice(1) && P[location.hash.slice(1)] ? location.hash.slice(1) : G.start);
</script>
</body>
</html>
